[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "submeso"
version = "0.1.0"
description = "Physics-informed CNN super-resolution of submesoscale ocean currents from satellite ADT and SST."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jayveer Kochhar" }]
requires-python = ">=3.10"
keywords = ["oceanography", "super-resolution", "altimetry", "submesoscale", "deep-learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.10",
  "pandas>=2.0",
  "xarray>=2023.6",
  "dask>=2023.6",
  "netCDF4>=1.6",
  "torch>=2.1",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "requests>=2.31",
]

[project.optional-dependencies]
data = ["copernicusmarine>=2.0"]
maps = ["cartopy>=0.22"]
web = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["onnx>=1.16", "onnxruntime>=1.18", "pytest>=7.4", "pytest-cov>=4.1", "ruff==0.16.9", "pre-commit>=3.5", "jupyter>=1.0"]

[project.scripts]
submeso = "submeso.cli:main"

[project.urls]
"Reference study" = "https://os.copernicus.org/articles/21/199/2025/"

[tool.hatch.build.targets.wheel]
packages = ["src/submeso"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
